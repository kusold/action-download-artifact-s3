name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.3"

      - name: Install action dependencies
        run: npm ci

      - name: Build action
        run: npm run build

      - name: Create Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: Release ${{ github.ref_name }}
          body: |
            ## Download Artifact from S3 ${{ github.ref_name }}

            ### Usage

            ```yaml
            - uses: ${{ github.repository }}@${{ github.ref_name }}
              with:
                name: my-artifact
                path: downloaded-artifacts
                s3-bucket: my-bucket
              env:
                AWS_ACCESS_KEY_ID: ${{ '{{' }} secrets.AWS_ACCESS_KEY_ID {{ '}}' }}
                AWS_SECRET_ACCESS_KEY: ${{ '{{' }} secrets.AWS_SECRET_ACCESS_KEY {{ '}}' }}
            ```

            See [README](https://github.com/${{ github.repository }}#readme) for full documentation.
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true

  update-major-tag:
    name: Update Major Version Tag
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get major version
        id: major
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          MAJOR=${VERSION%%.*}
          echo "major=v${MAJOR}" >> $GITHUB_OUTPUT

      - name: Update major version tag
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git tag -fa ${{ steps.major.outputs.major }} -m "Update ${{ steps.major.outputs.major }} to ${{ github.ref_name }}"
          git push origin ${{ steps.major.outputs.major }} --force
