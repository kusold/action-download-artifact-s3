name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # On PRs, check out the head branch (not the merge commit) so a
          # rebuilt dist/ can be pushed straight back to the PR branch.
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install action dependencies
        run: npm ci

      - name: Build action
        run: npm run build

      - name: Commit dist changes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if [[ -n "$(git status --porcelain dist/)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add dist/
            git commit -m "chore: rebuild dist [skip ci]"
            git push
          fi

      - name: Rebuild and push dist (PR only)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ -z "$(git status --porcelain dist/)" ]]; then
            echo "dist/ is up to date with src/."
            exit 0
          fi
          # Committing to Renovate branches is safe: renovate.json lists this
          # bot's email in gitIgnoredAuthors, so Renovate keeps treating its
          # branches as unmodified and can still rebase and automerge them.
          if [[ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]]; then
            echo "::error::dist/ is out of date and this is a fork PR, so CI cannot push the rebuild. Run 'npm run build' locally and commit dist/."
            git status --porcelain dist/
            exit 1
          fi
          echo "dist/ is stale; committing the rebuild and pushing to ${HEAD_REF}."
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/
          # [skip ci] keeps the GITHUB_TOKEN push from spawning synchronize
          # runs that sit in "action required" awaiting approval.
          git commit -m "chore: rebuild dist [skip ci]"
          if ! git push origin "HEAD:${HEAD_REF}"; then
            echo "::error::Failed to push rebuilt dist to ${HEAD_REF}."
            exit 1
          fi
          # A GITHUB_TOKEN push fires no push/pull_request events, so re-run
          # the PR workflows on the new head commit explicitly.
          # workflow_dispatch is one of the two events GITHUB_TOKEN can still
          # trigger. Skip markers do not suppress dispatched runs.
          ok=0
          gh workflow run ci.yml --ref "${HEAD_REF}" && ok=1
          gh workflow run integration-tests.yml --ref "${HEAD_REF}" && ok=1
          if [[ "${ok}" == "1" ]]; then
            echo "::notice::Rebuilt dist pushed and workflows re-triggered on the new commit."
          else
            echo "::warning::Rebuilt dist pushed, but workflows could not be re-triggered automatically (workflow_dispatch may not be on the default branch yet). Re-run them on ${HEAD_REF} manually."
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install action dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit
